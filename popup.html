<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSM Quick Connect</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <header class="header">
    <div class="account">
      <!-- <span class="avatar-logo">&gt;_</span> -->
       <img src="assets/favicon/ssm-32.png" alt="ssm icon">
      <span class="account-name">SSM Quick Connect</span>
    </div>
    <span class="pill-muted" id="switchaccount">Account</span>
  </header>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
    </svg>
    <input id="search" type="text" placeholder="Search hostname" autocomplete="off" autofocus />
  </div>

  <ul id="list" class="list"></ul>

  <nav class="tabs">
    <button id="tab-all" class="tab active" data-tab="all">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="6" rx="1.5"></rect>
        <rect x="3" y="14" width="18" height="6" rx="1.5"></rect>
        <line x1="7" y1="7" x2="7.01" y2="7"></line>
        <line x1="7" y1="17" x2="7.01" y2="17"></line>
      </svg>
      <span>Servers</span>
    </button>
    <button id="tab-fav" class="tab" data-tab="fav">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.1 8.6 22 9.3 16.8 14 18.2 21 12 17.5 5.8 21 7.2 14 2 9.3 8.9 8.6 12 2"></polygon>
      </svg>
      <span>Favorites</span>
    </button>
  </nav>

  <script src="js/popup.js"></script>
</body>
</html>
